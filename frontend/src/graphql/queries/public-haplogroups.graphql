query PublicHaplogroups {
  haplogroups {
    items {
      id
      name
      abbreviation
      subclade
      confirmationStatus
      haplogroupType
      participantCount
      participants {
        id
        displayName
        lineageMemberships {
          lineage {
            id
            displayName
          }
        }
      }
    }
    total
  }
}
